[build-system]
requires = ["setuptools==82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battwin-formal-framework"
version = "0.1.0"
description = "Faithful Python packaging of the BATTWIN chain-level Framework.ipynb experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0",
  "tensorflow==2.21.0", "keras==3.15.1", "scipy==1.16.3",
  "joblib==1.5.3", "matplotlib==3.10.9", "openpyxl==3.1.5",
  "ipython==9.13.0", "plotly==6.8.0",
]

[project.scripts]
battwin-framework = "battwin_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
battwin_framework = ["assets/**/*", "assets/*"]
